services:
  my-ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-ai-api/gateway:local
    container_name: my-ai-gateway
    restart: unless-stopped
    env_file:
      - .env.compose
    environment:
      # 数据库路径（兼容旧版 SPRING_DATASOURCE_URL，新版优先使用 MAG_DB_PATH）
      MAG_DB_PATH: /app/data/gateway.db
      # 内存上限（Go：GOMEMLIMIT 控制 GC 触发时机，数值略低于容器内存限制）
      GOMEMLIMIT: 480MiB
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:1399/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  my-ai-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: my-ai-api/frontend:local
    container_name: my-ai-frontend
    restart: unless-stopped
    depends_on:
      - my-ai-gateway
    ports:
      - "${FRONTEND_PORT:-3990}:80"
