services:
  my-ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-ai-api/gateway:local
    container_name: my-ai-gateway
    restart: unless-stopped
    env_file:
      - .env.compose
    environment:
      # transaction_mode=IMMEDIATE：避免 @Transactional 先读后写升级写锁时 SQLITE_BUSY_SNAPSHOT（见 application.yml）
      SPRING_DATASOURCE_URL: jdbc:sqlite:/app/data/gateway.db?transaction_mode=IMMEDIATE
      # -Xmx512m：显式限制堆上限。未设置且容器无 mem_limit 时，JVM 按宿主机总内存的 25% 计算堆上限
      # （如 96GB 宿主机 → 24GB），导致内存占用不可预期；同时 MaxDirectMemorySize 默认等于 MaxHeapSize，
      # 一并压住 reactor-netty DataBuffer 所用的 direct buffer 天花板。
      # 个人/小团队场景 512MB 堆足够（按 20 并发含图请求、单请求数 MB 估算）。
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Xmx512m
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:1399/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  my-ai-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: my-ai-api/frontend:local
    container_name: my-ai-frontend
    restart: unless-stopped
    depends_on:
      - my-ai-gateway
    ports:
      - "${FRONTEND_PORT:-3990}:80"
