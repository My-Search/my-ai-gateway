services:
  my-ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-ai-api/gateway:local
    container_name: my-ai-gateway
    restart: unless-stopped
    env_file:
      - .env.compose
    environment:
      # transaction_mode=IMMEDIATE：避免 @Transactional 先读后写升级写锁时 SQLITE_BUSY_SNAPSHOT（见 application.yml）
      SPRING_DATASOURCE_URL: jdbc:sqlite:/app/data/gateway.db?transaction_mode=IMMEDIATE
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:1399/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  my-ai-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: my-ai-api/frontend:local
    container_name: my-ai-frontend
    restart: unless-stopped
    depends_on:
      - my-ai-gateway
    ports:
      - "${FRONTEND_PORT:-3990}:80"
