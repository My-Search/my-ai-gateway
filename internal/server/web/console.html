      parts.push('<div class="empty-drop"></div>');
      parts.push('<div class="drop-empty">暂无小组，点击右上「+ 新建」创建</div>');
    } else {
      groups.forEach(group => parts.push(renderGroupCard(group)));
    }

    host.innerHTML = parts.join('');
  }

  /** 单个小组卡片：头部可拖拽（拖入右侧入口模型），展开后管理成员。 */
  function renderGroupCard(group) {
    const expanded = state.groupExpanded.has(group.id);
    const detail = state.groupDetail.get(group.id);
    const busy = state.groupBusy.has(group.id);
    const strategy = group.strategy || 'failover';

    const head =
      '<div class="card-head" data-action="toggle-group" data-group-id="' + group.id + '">' +
        '<span class="badge badge-blue">' + esc(strategyLabel(strategy)) + '</span>' +
        '<span class="card-title ellipsis">' + esc(group.name) + '</span>' +
        (group.sticky === 1 ? '<span class="badge badge-purple">粘性</span>' : '') +
        (group.enabled === 0 ? '<span class="badge badge-muted">已停用</span>' : '') +
        '<span class="card-spacer"></span>' +
        '<span class="card-sub">' +
          (group.memberCount || 0) + ' 成员 · 可用 ' + (group.availableCount || 0) +
          (group.brokenCount ? ' · 熔断 ' + group.brokenCount : '') +
        '</span>' +
        '<span class="caret muted" style="font-size:10px">' + (expanded ? '▾' : '▸') + '</span>' +
      '</div>';

    let body = '';
    if (expanded) {
      // 已有数据时刷新不闪成「加载中」：保留旧内容并加淡化提示，
      // 只有首次加载（无缓存）才展示 spinner。
      if (!detail) {
        body = '<div class="card-body"><div class="empty-state"><span class="spinner"></span> 加载成员…</div></div>';
      } else {
        body = '<div class="card-body"' + (busy ? ' style="opacity:.6"' : '') + '>' +
          renderGroupBody(group, detail) + '</div>';
      }
    }

    return '<div class="card" draggable="true" data-drag="group" data-group-id="' + group.id + '"' +
      ' data-drop="group" data-title="' + esc(group.name) + '">' + head + body + '</div>';
  }

  function renderGroupBody(group, detail) {
    const members = (detail.members || []).slice();
    const parts = [];

    // 组内配置：策略 / 粘性 / 启用状态（改动即时落库）
    parts.push(
      '<div class="flex gap-6 items-center" style="margin-bottom:8px;flex-wrap:wrap">' +
        '<select class="select select-sm" data-action="group-strategy" data-group-id="' + group.id + '">' +
          ['failover', 'random', 'round_robin'].map(s =>
            '<option value="' + s + '"' + (s === (group.strategy || 'failover') ? ' selected' : '') + '>' +
            esc(strategyLabel(s)) + '</option>').join('') +
        '</select>' +
        '<label class="secondary" style="font-size:12px">' +
          '<input type="checkbox" data-action="group-sticky" data-group-id="' + group.id + '"' +
          (group.sticky === 1 ? ' checked' : '') + ' /> 粘性</label>' +
        '<span class="card-spacer"></span>' +
        '<span class="card-sub">拖成员行可调整顺序</span>' +
        '<button class="btn btn-sm btn-ghost" data-action="group-delete" data-group-id="' + group.id + '"' +
          ' data-group-name="' + esc(group.name) + '">删除</button>' +
      '</div>'
    );

    if (!members.length) {
      parts.push('<div class="drop-empty">从左侧渠道模型池拖入模型，成为小组成员</div>');
    } else {
      parts.push(members.map((member, index) => renderMemberRow(member, index, group)).join(''));
    }

    if (detail.usedByModels && detail.usedByModels.length) {
      parts.push(
        '<div class="card-sub" style="margin-top:6px">被入口模型引用：' +
          detail.usedByModels.map(m => esc(m.modelName)).join('、') +
        '</div>'
      );
    }
    return parts.join('');
  }

  function renderMemberRow(member, index, group) {
    const broken = member.circuitBroken === 1;
    const unavailable = member.enabled === 0 || member.channelEnabled === 0 || member.apiKeyAvailable === 0;
    return '<div class="row-item' + (unavailable ? ' muted' : '') + '"' +
        ' draggable="true" data-drag="member" data-group-id="' + group.id + '"' +
        ' data-member-id="' + member.id + '" data-sort-index="' + index + '">' +
      '<span class="row-index">' + (index + 1) + '</span>' +
      '<div class="row-main">' +
        '<div class="row-name ellipsis">' + esc(member.channelModelName || ('成员 #' + member.id)) + '</div>' +
        '<div class="row-meta">' +
          '<span>' + esc(member.channelName || '-') + '</span>' +
          (member.contextLength ? '<span>ctx ' + fmtContext(member.contextLength) + '</span>' : '') +
          (member.ttftMs ? '<span>TTFT ' + fmtDuration(member.ttftMs) + '</span>' : '') +
          (member.outputSpeed ? '<span>' + Number(member.outputSpeed).toFixed(1) + ' t/s</span>' : '') +
          (broken ? '<span class="badge badge-red">熔断中</span>' : '') +
          (member.enabled === 0 ? '<span class="badge badge-muted">已停用</span>' : '') +
          (member.apiKeyAvailable === 0 ? '<span class="badge badge-yellow">无可用 Key</span>' : '') +
          (member.reasoningEffort ? '<span class="badge badge-blue">' + esc(member.reasoningEffort) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="row-tools">' +
        '<input class="input input-sm weight-input" type="number" min="1" max="1000" value="' +
          esc(member.weight || 1) + '" title="组内权重"' +
          ' data-action="member-weight" data-member-id="' + member.id + '" />' +
        '<button class="btn btn-sm btn-ghost" data-action="toggle-member" data-member-id="' + member.id + '"' +
          ' data-member-enabled="' + (member.enabled === 0 ? 1 : 0) + '"' +
          ' title="启用/停用">' + (member.enabled === 0 ? '启用' : '停用') + '</button>' +
        '<button class="btn btn-sm btn-ghost" data-action="remove-member" data-member-id="' + member.id + '"' +
          ' data-member-name="' + esc(member.channelModelName || '') + '"' +
          ' data-group-id="' + group.id + '" title="移出小组">×</button>' +
      '</div>' +
    '</div>';
  }

  function renderModels() {
    const host = $('#models-body');
    if (!host) return;
    const keyword = state.filters.model.trim().toLowerCase();
    const models = state.models.filter(m => !keyword || (m.modelName || '').toLowerCase().includes(keyword));

    if (!models.length) {
      host.innerHTML = '<div class="empty-state">' +
        (state.models.length ? '没有匹配的入口模型' : '暂无入口模型，请先在原后台创建') + '</div>';
      return;
    }
    host.innerHTML = models.map(model => renderModelCard(model)).join('');
  }

  /** 入口模型卡片：拖入小组即建立关联；展开后展示统一候选队列并支持排序。 */
  function renderModelCard(model) {
    const expanded = state.modelExpanded.has(model.id);
    const detail = state.modelDetail.get(model.id);
    const busy = state.modelBusy.has(model.id);
    const inherit = model.relMode === 'inherit';

    const relCount = detail
      ? (detail.rels || []).length + (detail.groupRels || []).length
      : null;

    const head =
      '<div class="card-head" data-action="toggle-model" data-model-id="' + model.id + '">' +
        '<span class="card-title ellipsis">' + esc(model.modelName) + '</span>' +
        (inherit ? '<span class="badge badge-yellow">继承模式 · 只读</span>' : '') +
        (model.enabled === 0 ? '<span class="badge badge-muted">已停用</span>' : '') +
        (model.hidden === 1 ? '<span class="badge badge-muted">隐藏</span>' : '') +
        '<span class="card-spacer"></span>' +
        '<span class="card-sub">' + (relCount === null ? '展开查看候选' : relCount + ' 条候选') + '</span>' +
        '<span class="caret muted" style="font-size:10px">' + (expanded ? '▾' : '▸') + '</span>' +
      '</div>';

    let body = '';
    if (expanded) {
      // 同小组卡片：有缓存时刷新只做淡化，不闪加载态。
      if (!detail) {
        body = '<div class="card-body"><div class="empty-state"><span class="spinner"></span> 加载候选队列…</div></div>';
      } else {
        body = '<div class="card-body"' + (busy ? ' style="opacity:.6"' : '') + '>' +
          renderModelQueue(model, detail) + '</div>';
      }
    }

    // 继承模式下后端拒绝改关联，这里直接禁用拖放目标，避免无谓报错。
    return '<div class="card" data-drop="model" data-model-id="' + model.id + '"' +
      ' data-inherit="' + (inherit ? '1' : '0') + '"' +
      ' data-title="' + esc(model.modelName) + '">' + head + body + '</div>';
  }

  /** 合并渠道模型关联与小组关联，按 sort_order 还原真实尝试顺序。 */
  function buildCandidateQueue(detail) {
    const queue = [];
    (detail.rels || []).forEach(rel => {
      queue.push({
        kind: 'cm',
        id: rel.id,
        sortOrder: rel.sortOrder === null || rel.sortOrder === undefined ? 0 : rel.sortOrder,
        channelModelId: rel.channelModelId,
        name: rel.channelModelName || ('渠道模型 #' + rel.channelModelId),
        sub: rel.channelName || '',
        rel: rel
      });
    });
    (detail.groupRels || []).forEach(rel => {
      queue.push({
        kind: 'g',
        id: rel.id,
        sortOrder: rel.sortOrder === null || rel.sortOrder === undefined ? 0 : rel.sortOrder,
        groupId: rel.groupId,
        name: rel.groupName || ('小组 #' + rel.groupId),
        sub: strategyLabel(rel.groupStrategy) + (rel.groupSticky === 1 ? ' · 粘性' : ''),
        rel: rel
      });
    });
    queue.sort((a, b) => (a.sortOrder - b.sortOrder) || (a.id - b.id));
    return queue;
  }

  function renderModelQueue(model, detail) {
    const queue = buildCandidateQueue(detail);
    const readonly = model.relMode === 'inherit';
    const parts = [];

    if (readonly) {
      const source = detail.inheritFromModelName;
      parts.push('<div class="drop-zone-hint" style="text-align:left">' +
        '当前为继承模式，候选队列来自源模型' + (source ? '「' + esc(source) + '」' : '') + '，不可直接修改。' +
        '</div>');
    }

    if (!queue.length) {
      parts.push('<div class="drop-empty">' +
        (readonly ? '源模型暂无可继承的候选' : '把中间的小组拖到这张卡片上，建立关联') + '</div>');
    } else {
      parts.push(queue.map((item, index) => renderCandidateRow(item, index, readonly)).join(''));
    }

    if (!readonly) {
      parts.push('<div class="drop-zone-hint" style="margin-top:6px">拖入小组卡片可追加候选；拖行可调整顺序</div>');
    }
    return parts.join('');
  }

  function renderCandidateRow(item, index, readonly) {
    const rel = item.rel;
    const isGroup = item.kind === 'g';
    const broken = rel.circuitBroken === 1;
    const meta = [];

    if (isGroup) {
      meta.push('<span class="badge badge-blue">小组</span>');
      meta.push('<span>成员 ' + (rel.memberCount || 0) + ' · 可用 ' + (rel.availableCount || 0) + '</span>');
      if (rel.brokenCount) meta.push('<span class="badge badge-yellow">熔断 ' + rel.brokenCount + '</span>');
      if (rel.maxContextLength) meta.push('<span>ctx ' + fmtContext(rel.maxContextLength) + '</span>');
      if (rel.memberModelNames && rel.memberModelNames.length) {
        meta.push('<span class="ellipsis" style="max-width:220px">' + esc(rel.memberModelNames.join(' / ')) + '</span>');
      }
    } else {
      if (rel.channelEnabled === 0) meta.push('<span class="badge badge-muted">渠道停用</span>');
      if (rel.apiKeyAvailable === 0) meta.push('<span class="badge badge-yellow">无可用 Key</span>');
      if (rel.contextLength) meta.push('<span>ctx ' + fmtContext(rel.contextLength) + '</span>');
    }
    if (rel.ttftMs) meta.push('<span>TTFT ' + fmtDuration(rel.ttftMs) + '</span>');
    if (rel.outputSpeed) meta.push('<span>' + Number(rel.outputSpeed).toFixed(1) + ' t/s</span>');
    if (rel.reasoningEffort) meta.push('<span class="badge badge-blue">' + esc(rel.reasoningEffort) + '</span>');
    if (broken) meta.push('<span class="badge badge-red">熔断中</span>');

    return '<div class="row-item"' +
        (readonly ? '' : ' draggable="true" data-drag="rel" data-model-id="' + rel.modelId +
          '" data-ref="' + item.kind + ':' + item.id + '" data-sort-index="' + index + '"') + '>' +
      '<span class="row-index">' + (index + 1) + '</span>' +
      '<div class="row-main">' +
        '<div class="row-name ellipsis">' + esc(item.name) + '</div>' +
        '<div class="row-meta">' +
          (isGroup ? '' : '<span>' + esc(item.sub) + '</span>') +
          meta.join(' ') +
        '</div>' +
      '</div>' +
      (readonly ? '' :
        '<div class="row-tools">' +
          '<button class="btn btn-sm btn-ghost" title="移除候选"' +
            ' data-action="remove-rel" data-model-id="' + rel.modelId + '"' +
            ' data-ref="' + item.kind + ':' + item.id + '"' +
            ' data-rel-name="' + esc(item.name) + '">×</button>' +
        '</div>') +
    '</div>';
  }

  /* ══════════════════════════ 7. 三段式拖拽 ══════════════════════════ */

  /**
   * 拖拽模型：
   *   pool   → 渠道模型（拖到小组卡片/成员区 = 加入成员）
   *   group  → 小组（拖到入口模型卡片 = 建立关联）
   *   member → 小组成员行（组内排序）
   *   rel    → 入口模型候选行（候选排序）
   * 用模块级变量承载载荷，dataTransfer 只放一份 JSON 兼容外部拖入。
   */
  const drag = { payload: null, overEl: null };

  const DND_MIME = 'application/x-mag-drag';

  function dragPayloadFromEvent(event) {
    if (drag.payload) return drag.payload;
    try {
      const raw = event.dataTransfer.getData(DND_MIME);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function onDragStart(event) {
    const source = event.target.closest('[data-drag]');
    if (!source) return;
    const kind = source.getAttribute('data-drag');
    const payload = { kind: kind };

    if (kind === 'pool') {
      payload.channelModelId = Number(source.getAttribute('data-channel-model-id'));
      payload.label = source.querySelector('.pool-item-name') ? source.querySelector('.pool-item-name').textContent : '';
    } else if (kind === 'group') {
      payload.groupId = Number(source.getAttribute('data-group-id'));
      payload.label = source.getAttribute('data-title') || '';
    } else if (kind === 'member') {
      payload.memberId = Number(source.getAttribute('data-member-id'));
      payload.groupId = Number(source.getAttribute('data-group-id'));
      payload.index = Number(source.getAttribute('data-sort-index'));
    } else if (kind === 'rel') {
      payload.modelId = Number(source.getAttribute('data-model-id'));
      payload.ref = source.getAttribute('data-ref');
      payload.index = Number(source.getAttribute('data-sort-index'));
    } else {
      return;
    }

    drag.payload = payload;
    source.classList.add('is-dragging');
    if (event.dataTransfer) {
      event.dataTransfer.effectAllowed = 'move';
      try { event.dataTransfer.setData(DND_MIME, JSON.stringify(payload)); } catch (e) { /* 忽略 */ }
      try { event.dataTransfer.setData('text/plain', payload.label || ''); } catch (e) { /* 忽略 */ }
    }
  }

  function onDragEnd(event) {
    const source = event.target.closest('[data-drag]');
    if (source) source.classList.remove('is-dragging');
    clearDropHighlight();
    drag.payload = null;
  }

  function clearDropHighlight() {
    if (drag.overEl) {
      drag.overEl.classList.remove('is-drop-target');
      drag.overEl = null;
    }
  }

  /** 计算当前拖拽在目标上是否可放置；返回放置描述或 null。 */
  function resolveDropTarget(target, payload) {
    if (!payload || !target) return null;

    // 1) 池里的渠道模型 → 小组卡片
    if (payload.kind === 'pool') {
      const groupCard = target.closest('[data-drop="group"]');
      if (!groupCard) return null;
      return {
        action: 'add-member',
        groupId: Number(groupCard.getAttribute('data-group-id')),
        el: groupCard
      };
    }

    // 2) 小组卡片 → 入口模型卡片
    if (payload.kind === 'group') {
      const modelCard = target.closest('[data-drop="model"]');
      if (!modelCard) return null;
      // 继承模式的入口模型不允许改关联（后端同样会拒绝）
      if (modelCard.getAttribute('data-inherit') === '1') return null;
      return {
        action: 'add-group-rel',
        modelId: Number(modelCard.getAttribute('data-model-id')),
        groupId: payload.groupId,
        el: modelCard
      };
    }

    // 3) 组内成员行 → 同组成员行（排序）
    if (payload.kind === 'member') {
      const memberRow = target.closest('[data-drag="member"]');
      if (!memberRow) return null;
      const groupId = Number(memberRow.getAttribute('data-group-id'));
      if (groupId !== payload.groupId) return null;
      return {
        action: 'reorder-member',
        groupId: groupId,
        toIndex: Number(memberRow.getAttribute('data-sort-index')),
        el: memberRow
      };
    }

    // 4) 候选行 → 同模型候选行（排序）
    if (payload.kind === 'rel') {
      const relRow = target.closest('[data-drag="rel"]');
      if (!relRow) return null;
      if (Number(relRow.getAttribute('data-model-id')) !== payload.modelId) return null;
      return {
        action: 'reorder-rel',
        modelId: payload.modelId,
        toIndex: Number(relRow.getAttribute('data-sort-index')),
        el: relRow
      };
    }

    return null;
  }

  function onDragOver(event) {
    const payload = drag.payload;
    if (!payload) return;
    const resolution = resolveDropTarget(event.target, payload);
    if (!resolution) {
      clearDropHighlight();
      return;
    }
    // 必须阻止默认行为，否则 drop 不会触发。
    event.preventDefault();
    if (event.dataTransfer) event.dataTransfer.dropEffect = 'move';

    if (drag.overEl !== resolution.el) {
      clearDropHighlight();
      resolution.el.classList.add('is-drop-target');
      drag.overEl = resolution.el;
    }
  }

  function onDrop(event) {
    const payload = dragPayloadFromEvent(event);
    const resolution = resolveDropTarget(event.target, payload);
    if (!resolution) return;
    event.preventDefault();
    clearDropHighlight();

    if (resolution.action === 'add-member') handleAddMember(resolution, payload);
    else if (resolution.action === 'add-group-rel') handleAddGroupRel(resolution, payload);
    else if (resolution.action === 'reorder-member') handleReorderMember(resolution, payload);
    else if (resolution.action === 'reorder-rel') handleReorderRel(resolution, payload);
  }

  /** 渠道模型 → 小组：POST members，然后刷新该组详情与列表摘要。 */
  async function handleAddMember(resolution, payload) {
    const item = state.poolByKey.get(payload.key || '');
    try {
      const data = assertSuccess(
        await api.addGroupMembers(resolution.groupId, [payload.channelModelId]),
        '加入成员失败'
      );
      if (!data.count) {
        toast('该模型已在此小组中', 'info');
        return;
      }
      toast('已加入小组' + (item ? '：' + item.modelName : ''), 'ok');
      state.groupExpanded.add(resolution.groupId);
      await Promise.all([
        ensureGroupDetail(resolution.groupId, true),
        loadGroups()
      ]);
      renderPool(); // 「已在组内」标记需要跟随刷新
    } catch (e) {
      toast('加入成员失败：' + e.message, 'err');
    }
  }

  /** 小组 → 入口模型：POST /models/:id/rels，然后刷新该模型候选队列。 */
  async function handleAddGroupRel(resolution, payload) {
    try {
      const data = assertSuccess(
        await api.addModelRels(resolution.modelId, { groupIds: [payload.groupId] }),
        '建立关联失败'
      );
      if (!data.count) {
        toast('该入口模型已关联此小组', 'info');
        return;
      }
      toast('已建立关联' + (payload.label ? '：' + payload.label : ''), 'ok');
      state.modelExpanded.add(resolution.modelId);
      await ensureModelDetail(resolution.modelId, true);
    } catch (e) {
      toast('建立关联失败：' + e.message, 'err');
    }
  }

  /** 组内排序：整表提交，后端按数组下标写 sort_order。 */
  async function handleReorderMember(resolution, payload) {
    const detail = state.groupDetail.get(resolution.groupId);
    if (!detail || !detail.members) return;
    const ids = detail.members.map(m => m.id);
    const from = ids.indexOf(payload.memberId);
    const to = resolution.toIndex;
    if (from < 0 || to < 0 || from === to) return;

    ids.splice(to, 0, ids.splice(from, 1)[0]);
    // 先本地生效，避免等待网络造成的拖拽迟滞。
    detail.members = ids.map(id => detail.members.find(m => m.id === id));
    renderGroups();

    try {
      assertSuccess(await api.sortGroupMembers(ids), '排序失败');
    } catch (e) {
      toast('排序失败：' + e.message, 'err');
      await ensureGroupDetail(resolution.groupId, true);
    }
  }

  /** 候选排序：提交混合引用 "cm:<id>" / "g:<id>"，两张表共用序号空间。 */
  async function handleReorderRel(resolution, payload) {
    const detail = state.modelDetail.get(resolution.modelId);
    if (!detail) return;
    const queue = buildCandidateQueue(detail);
    const refs = queue.map(item => item.kind + ':' + item.id);
    const from = refs.indexOf(payload.ref);
    const to = resolution.toIndex;
    if (from < 0 || to < 0 || from === to) return;

    refs.splice(to, 0, refs.splice(from, 1)[0]);
    try {
      assertSuccess(await api.sortRels(refs), '排序失败');
      await ensureModelDetail(resolution.modelId, true);
    } catch (e) {
      toast('排序失败：' + e.message, 'err');
    }
  }

  /* ══════════════════════════ 8. 日志：数据归一化 ══════════════════════════ */

  /**
   * 把接口返回的 trace 数组并入本地行存储。
   * 以 logId 去重：分页可能返回同一 trace 的更新快照（分页边界），SSE 也会重复推送。
   */
  function mergeTraces(traces) {
    (traces || []).forEach(trace => {
      if (!trace || !trace.traceId) return;
      let bucket = state.logs.rows.get(trace.traceId);
      if (!bucket) {
        bucket = new Map();
        state.logs.rows.set(trace.traceId, bucket);
      }
      (trace.logs || []).forEach(row => {
        if (!row || row.id === undefined || row.id === null) return;
        bucket.set(row.id, row);
      });
    });
    rebuildTraceOrder();
  }

  /** 单条 SSE 行并入（新 trace 由排序规则自然顶到最前）。 */
  function mergeLiveRow(row) {
    if (!row || !row.traceId) return;
    let bucket = state.logs.rows.get(row.traceId);
    if (!bucket) {
      bucket = new Map();
      state.logs.rows.set(row.traceId, bucket);
    }
    bucket.set(row.id, row);
    rebuildTraceOrder();
  }

  /** 计算 trace 的时间基准：用 responseTimeMs 倒推出每次尝试的起点。 */
  function spanOfRow(row) {
    const created = Date.parse(row.createdAt);
    if (isNaN(created)) return null;
    const duration = Number(row.responseTimeMs) > 0 ? Number(row.responseTimeMs) : 0;
    return { start: created - duration, end: created, duration: duration };
  }

  /** 汇总一个 trace 的展示模型（阶段计数、起止、总耗时、基准时间）。 */
  function buildTraceView(traceId) {
    const bucket = state.logs.rows.get(traceId);
    if (!bucket || !bucket.size) return null;
    const rows = Array.from(bucket.values())
      .sort((a, b) => (Date.parse(a.createdAt) - Date.parse(b.createdAt)) || (a.id - b.id));

    const counts = { retry: 0, success: 0, fail: 0, skip: 0, interrupted: 0 };
    let base = Infinity;
    let latest = -Infinity;
    let totalTimeMs = 0;
    let modelName = '';
    let protocol = '';
    let routeSource = '';

    rows.forEach(row => {
      if (row.phase && counts[row.phase] !== undefined) counts[row.phase] += 1;
      if (!modelName && row.modelName) modelName = row.modelName;
      if (!protocol && row.protocol) protocol = row.protocol;
      if (!routeSource && row.routeSource) routeSource = row.routeSource;
      if (row.phase === 'success' || row.phase === 'fail' || row.phase === 'interrupted') {
        if (Number(row.responseTimeMs) > 0) totalTimeMs += Number(row.responseTimeMs);
      }
      const span = spanOfRow(row);
      if (span) {
        if (span.start < base) base = span.start;
        if (span.end > latest) latest = span.end;
      }
    });
    if (!isFinite(base)) base = 0;
    if (!isFinite(latest)) latest = base;

    // 终态优先展示：失败 > 中断 > 成功 > 进行中
    let terminal = 'pending';
    if (counts.fail > 0) terminal = 'fail';
    else if (counts.interrupted > 0) terminal = 'interrupted';
    else if (counts.success > 0) terminal = 'success';

    const lastRow = rows[rows.length - 1];
    return {
      traceId: traceId,
      rows: rows,
      counts: counts,
      modelName: modelName,
      protocol: protocol,
      routeSource: routeSource,
      base: base,
      span: Math.max(1, latest - base),
      totalTimeMs: totalTimeMs,
      terminal: terminal,
      lastAt: lastRow ? Date.parse(lastRow.createdAt) : 0,
      hasRequestData: rows.some(r => r.requestHeaders || r.requestBody)
    };
  }

  /**
   * 重建 trace 展示顺序与视图缓存。
   *
   * 排序口径统一为「最近一条日志的时间」倒序：SSE 推送的进行中请求会自然顶到
   * 最前，已完成的则按结束时间排序，不需要为「新 trace 插入头部」单独开分支。
   */
  function rebuildTraceOrder() {
    const views = new Map();
    state.logs.rows.forEach((bucket, id) => {
      if (!bucket || !bucket.size) return;
      const view = buildTraceView(id);
      if (view) views.set(id, view);
    });
    state.logs.order = Array.from(views.keys()).sort((a, b) => views.get(b).lastAt - views.get(a).lastAt);
    state.traceViews = views;
  }

  function visibleTraceIds() {
    const filter = state.logs.filters;
    const keyword = state.logs.traceFilter.trim().toLowerCase();
    const startMs = filter.startTime ? Date.parse(filter.startTime) : null;
    const endMs = filter.endTime ? Date.parse(filter.endTime) : null;

    return state.logs.order.filter(id => {
      const view = state.traceViews.get(id);
      if (!view) return false;
      if (filter.modelName && view.modelName !== filter.modelName) return false;
      if (keyword && !id.toLowerCase().includes(keyword)) return false;
      if (startMs !== null && view.lastAt < startMs) return false;
      if (endMs !== null && view.lastAt > endMs) return false;
      return true;
    });
  }

  /* ══════════════════════════ 9. 日志：加载与实时 ══════════════════════════ */

  async function loadLogs(reset) {
    const logs = state.logs;
    if (logs.loading) return;
    logs.loading = true;
    if (reset) {
      logs.rows = new Map();
      logs.order = [];
      logs.offset = 0;
      logs.open.clear();
      state.traceViews = new Map();
    }
    renderLogs();

    try {
      const data = await api.logs({
        offset: logs.offset,
        limit: logs.limit,
        modelName: logs.filters.modelName,
        startTime: logs.filters.startTime,
        endTime: logs.filters.endTime
      });
      mergeTraces(data && data.data);
      logs.total = (data && data.total) || 0;
      logs.hasMore = !!(data && data.hasMore);
      logs.offset += (data && data.data ? data.data.length : 0);
      $('#log-status').textContent = '共 ' + fmtInt(logs.total) + ' 条链路';
    } catch (e) {
      if (e.status === 401) return; // 由统一鉴权流程接管
      toast('加载日志失败：' + e.message, 'err');
    } finally {
      logs.loading = false;
      renderLogs();
    }
  }

  /** 日志模型下拉：只填充入口模型名，避免自由输入产生无效过滤。 */
  async function loadLogModelOptions() {
    try {
      if (!state.models.length) await loadModels();
      const names = state.models.map(m => m.modelName).sort();
      state.logModels = names;
      const select = $('#log-model');
      if (!select) return;
      const current = select.value;
      select.innerHTML = '<option value="">全部</option>' +
        names.map(n => '<option value="' + esc(n) + '">' + esc(n) + '</option>').join('');
      if (current) select.value = current;
    } catch (e) {
      console.warn('加载日志模型下拉失败', e);
    }
  }

  function toggleLive(on) {
    const logs = state.logs;
    if (logs.liveSource) {
      logs.liveSource.close();
      logs.liveSource = null;
    }
    if (!on) {
      $('#log-status').textContent = '已停止实时';
      return;
    }
    if (!api.token) {
      toast('实时日志需要登录令牌，请重新登录', 'err');
      $('#log-live').checked = false;
      return;
    }

    // EventSource 不能自定义请求头，后端支持 ?token= 形态（与 Java 版一致）。
    const url = API_BASE + '/logs/stream?token=' + encodeURIComponent(api.token);
    const source = new EventSource(url);
    logs.liveSource = source;
    $('#log-status').textContent = '实时连接中…';

    source.onopen = () => { $('#log-status').textContent = '实时已连接'; };
    source.addEventListener('log', event => {
      try {
        const row = JSON.parse(event.data);
        mergeLiveRow(row);
        scheduleLogRender();
      } catch (e) {
        console.warn('解析实时日志失败', e);
      }
    });
    source.onerror = () => {
      $('#log-status').textContent = '实时连接断开，正在重连…';
    };
  }

  /** SSE 高频推送合并渲染，避免每行都触发一次整表 DOM 重建。 */
  const scheduleLogRender = debounce(() => renderLogs(), 250);

  /* ══════════════════════════ 10. 日志：渲染 ══════════════════════════ */

  function renderLogs() {
    const host = $('#trace-list');
    if (!host) return;
    const logs = state.logs;

    if (logs.loading && !logs.order.length) {
      host.innerHTML = '<div class="empty-state"><span class="spinner"></span> 正在加载日志…</div>';
      return;
    }

    const ids = visibleTraceIds();
    if (!ids.length) {
      host.innerHTML = '<div class="empty-state">' +
        (logs.order.length ? '没有匹配的链路，试试放宽筛选条件' : '暂无日志数据') + '</div>';
      updateLoadMore();
      return;
    }

    host.innerHTML = ids.map(id => renderTraceCard(state.traceViews.get(id))).join('');
    updateLoadMore();
  }

  function updateLoadMore() {
    const el = $('#load-more');
    if (!el) return;
    const hasMore = state.logs.hasMore;
    el.classList.toggle('hidden', !hasMore);
    el.textContent = state.logs.loading ? '加载中…' : '加载更多';
  }

  function renderTraceCard(view) {
    const open = state.logs.open.has(view.traceId);
    const counts = view.counts;

    const badges = [];
    if (counts.fail) badges.push('<span class="badge badge-red">失败 ' + counts.fail + '</span>');
    if (counts.success) badges.push('<span class="badge badge-green">成功 ' + counts.success + '</span>');
    if (counts.retry) badges.push('<span class="badge badge-yellow">重试 ' + counts.retry + '</span>');
    if (counts.skip) badges.push('<span class="badge badge-muted">跳过 ' + counts.skip + '</span>');
    if (counts.interrupted) badges.push('<span class="badge badge-muted">中断 ' + counts.interrupted + '</span>');
    if (view.terminal === 'pending') badges.push('<span class="badge badge-blue">进行中</span>');
    if (view.protocol) badges.push('<span class="badge badge-purple">' + esc(protocolLabel(view.protocol)) + '</span>');
    if (view.routeSource) badges.push('<span class="badge badge-blue">' + esc(routeSourceLabel(view.routeSource)) + '</span>');

    return '<div class="trace-card' + (open ? ' is-open' : '') + '" data-trace-id="' + esc(view.traceId) + '">' +
      '<div class="trace-head" data-action="toggle-trace">' +
        '<div class="trace-id-wrap">' +
          '<span class="trace-id" title="' + esc(view.traceId) + '">' + esc(view.traceId) + '</span>' +
          '<button class="trace-copy" data-action="copy-trace" data-trace-id="' + esc(view.traceId) + '"' +
            ' title="复制 traceId">复制</button>' +
        '</div>' +
        '<div class="trace-summary">' +
          (view.modelName ? '<span class="badge badge-muted">' + esc(view.modelName) + '</span>' : '') +
          badges.join(' ') +
        '</div>' +
        '<div class="trace-meta">' +
          '<span>' + esc(fmtDateTime(view.rows[0].createdAt)) + '</span>' +
          '<span>总计 ' + esc(fmtDuration(view.span)) + '</span>' +
          '<span>' + view.rows.length + ' 跳</span>' +
          '<span class="muted">' + (open ? '▾' : '▸') + '</span>' +
        '</div>' +
      '</div>' +
      (open ? renderTimeline(view) : '') +
    '</div>';
  }

  /** 链路时间线：瀑布条 + 逐跳明细，是「链路追踪」的核心视图。 */
  function renderTimeline(view) {
    const parts = [];

    // 水位条：每跳按真实耗时占位，直观看出慢在哪一次尝试。
    parts.push('<div class="waterfall">' + view.rows.map(row => {
      const span = spanOfRow(row);
      const offset = span ? (span.start - view.base) : 0;
      const width = span ? Math.max(span.duration, view.span * 0.005, 2) : 2;
      const leftPct = (offset / view.span) * 100;
      const widthPct = Math.min(100 - leftPct, (width / view.span) * 100);
      const label = phaseLabel(row.phase) + ' · ' +
        (row.channelName || '客户端') + (row.channelModelName ? '/' + row.channelModelName : '') +
        ' · ' + fmtDuration(span ? span.duration : 0);
      return '<div class="wf-seg wf-seg--' + esc(row.phase || 'start') + '"' +
        ' style="position:absolute;left:' + leftPct.toFixed(3) + '%;width:' + Math.max(widthPct, 0.4).toFixed(3) + '%"' +
        ' title="' + esc(label) + '"></div>';
    }).join('') + '</div>');

    parts.push('<div class="wf-axis"><span>0ms</span><span>' + esc(fmtDuration(view.span)) + '</span></div>');

    // 逐跳明细
    view.rows.forEach((row, index) => {
      parts.push(renderHop(view, row, index));
    });

    // trace 级操作
    parts.push('<div class="trace-foot">' +
      '<button class="btn btn-sm btn-ghost" data-action="copy-trace" data-trace-id="' + esc(view.traceId) + '">复制 traceId</button>' +
      '<button class="btn btn-sm btn-ghost" data-action="filter-by-trace" data-trace-id="' + esc(view.traceId) + '">按此 traceId 过滤</button>' +
      (view.hasRequestData
        ? '<button class="btn btn-sm btn-ghost" data-action="toggle-request-data" data-trace-id="' + esc(view.traceId) + '">查看原始请求</button>'
        : '') +
    '</div>');

    return '<div class="trace-timeline">' + parts.join('') + '</div>';
  }

  function renderHop(view, row, index) {
    const span = spanOfRow(row);
    const offset = span ? (span.start - view.base) : 0;
    const leftPct = (offset / view.span) * 100;
    const widthPct = span ? Math.min(100 - leftPct, (span.duration / view.span) * 100) : 0;

    const isClient = !row.channelName && !row.channelModelName;
    const routeName = isClient
      ? '客户端 → 网关' + (row.modelName ? '（' + row.modelName + '）' : '')
      : (row.channelName || '-') + ' / ' + (row.channelModelName || row.modelName || '-');

    const metrics = [];
    if (span && span.duration > 0) metrics.push('<span class="hop-metric" title="本次耗时">' + fmtDuration(span.duration) + '</span>');
    if (row.firstByteMs) metrics.push('<span class="hop-metric" title="首字节时间">TTFT ' + fmtDuration(row.firstByteMs) + '</span>');
    if (row.promptTokens || row.completionTokens) {
      metrics.push('<span class="hop-metric" title="输入/输出 token">' +
        fmtInt(row.promptTokens || 0) + ' → ' + fmtInt(row.completionTokens || 0) + '</span>');
    }
    if (row.retryIndex) metrics.push('<span class="hop-metric" title="第几次重试">#' + row.retryIndex + '</span>');

    const badges = [];
    badges.push('<span class="' + phaseBadge(row.phase) + '">' + esc(phaseLabel(row.phase)) + '</span>');
    if (row.status) badges.push('<span class="badge badge-muted">' + esc(row.status) + '</span>');
    if (row.protocol) badges.push('<span class="badge badge-purple">' + esc(protocolLabel(row.protocol)) + '</span>');
    if (row.routeSource) {
      badges.push('<span class="badge badge-blue" title="' + esc(routeSourceTitle(row.routeSource)) + '">' +
        esc(routeSourceLabel(row.routeSource)) + '</span>');
    }
    if (row.reasoningEffort) badges.push('<span class="badge badge-muted">' + esc(row.reasoningEffort) + '</span>');

    return '<div class="hop">' +
      '<span class="hop-no">' + (index + 1) + '</span>' +
      '<div style="min-width:0">' + badges.join(' ') + '</div>' +
      '<div class="hop-route">' +
        '<div class="hop-route-name ellipsis" title="' + esc(routeName) + '">' + esc(routeName) + '</div>' +
        '<div class="hop-route-sub">' +
          esc(fmtClock(row.createdAt)) +
          (row.apiKeyName ? ' · Key ' + esc(row.apiKeyName) : '') +
        '</div>' +
      '</div>' +
      '<div class="hop-bar" title="' + esc('起点 +' + Math.round(offset) + 'ms，耗时 ' + fmtDuration(span ? span.duration : 0)) + '">' +
        '<div class="hop-bar-fill hop-bar-fill--' + esc(row.phase || 'start') + '"' +
          ' style="left:' + leftPct.toFixed(3) + '%;width:' + Math.max(widthPct, 0.4).toFixed(3) + '%"></div>' +
      '</div>' +
      '<div class="hop-metrics">' + metrics.join('') + '</div>' +
      (row.message
        ? '<div class="hop-message' + (row.phase === 'fail' ? ' is-error' : '') + '">' + esc(row.message) + '</div>'
        : '') +
    '</div>';
  }

  /** 原始请求数据按需加载（列表接口有意不返回大字段）。 */
  async function toggleRequestData(traceId) {
    const view = state.traceViews.get(traceId);
    if (!view) return;
    const startRow = view.rows.find(r => r.phase === 'start' && (r.requestHeaders || r.requestBody)) ||
      view.rows.find(r => r.phase === 'start' && r.channelName) ||
      view.rows[0];
    const host = $('.trace-card[data-trace-id="' + cssEscapeAttr(traceId) + '"] .trace-timeline');
    if (!host) return;

    let box = host.querySelector('.request-data[data-trace-id="' + traceId + '"]');
    if (box) { box.remove(); return; }

    box = document.createElement('div');
    box.className = 'request-data';
    box.setAttribute('data-trace-id', traceId);
    box.innerHTML = '<div class="card-sub"><span class="spinner"></span> 正在读取原始请求…</div>';
    host.appendChild(box);

    try {
      const data = await api.requestData(startRow.id);
      const headers = prettyJson(data && data.requestHeaders);
      const body = prettyJson(data && data.requestBody);
      box.innerHTML =
        '<div class="card-sub">原始请求（日志 #' + esc(startRow.id) + '）</div>' +
        '<div class="card-sub" style="margin-top:6px">请求头</div>' +
        '<pre>' + esc(headers || '暂无数据') + '</pre>' +
        '<div class="card-sub" style="margin-top:6px">请求体</div>' +
        '<pre>' + esc(body || '暂无数据') + '</pre>';
    } catch (e) {
      box.innerHTML = '<div class="card-sub">读取失败：' + esc(e.message) + '</div>';
    }
  }

  function prettyJson(raw) {
    if (!raw) return '';
    try {
      return JSON.stringify(JSON.parse(raw), null, 2);
    } catch (e) {
      return String(raw);
    }
  }

  /** 选择器里的属性值转义（traceId 只含十六进制字符，这里做防御）。 */
  function cssEscapeAttr(value) {
    return String(value).replace(/["\\]/g, '\\$&');
  }

  /* ══════════════════════════ 11. 事件绑定 ══════════════════════════ */

  function bindTopologyEvents() {
    const topo = $('#view-topology');

    topo.addEventListener('dragstart', onDragStart);
    topo.addEventListener('dragend', onDragEnd);
    topo.addEventListener('dragover', onDragOver);
    topo.addEventListener('drop', onDrop);
    topo.addEventListener('dragleave', event => {
      // 只有离开列容器时才清除高亮，避免子元素间移动导致闪烁。
      if (!topo.contains(event.relatedTarget)) clearDropHighlight();
    });

    topo.addEventListener('click', async event => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.getAttribute('data-action');

      if (action === 'toggle-channel') {
        const id = Number(target.getAttribute('data-channel-id'));
        if (state.poolExpanded.has(id)) state.poolExpanded.delete(id);
        else state.poolExpanded.add(id);
        renderPool();
        return;
      }

      if (action === 'toggle-group') {
        const id = Number(target.getAttribute('data-group-id'));
        if (state.groupExpanded.has(id)) {
          state.groupExpanded.delete(id);
          renderGroups();
        } else {
          state.groupExpanded.add(id);
          renderGroups();
          ensureGroupDetail(id).then(() => renderGroups());
        }
        return;
      }

      if (action === 'toggle-model') {
        const id = Number(target.getAttribute('data-model-id'));
        if (state.modelExpanded.has(id)) {
          state.modelExpanded.delete(id);
          renderModels();
        } else {
          state.modelExpanded.add(id);
          renderModels();
          ensureModelDetail(id).then(() => renderModels());
        }
        return;
      }

      if (action === 'cancel-new-group') {
        state.newGroupOpen = false;
        renderGroups();
        return;
      }

      if (action === 'create-group') {
        await createGroup();
        return;
      }

      if (action === 'remove-member') {
        const memberId = Number(target.getAttribute('data-member-id'));
        const groupId = Number(target.getAttribute('data-group-id'));
        const name = target.getAttribute('data-member-name') || '';
        if (!confirm('确认把「' + name + '」移出该小组？')) return;
        try {
          assertSuccess(await api.removeGroupMember(memberId), '移出失败');
          toast('已移出小组', 'ok');
          await Promise.all([ensureGroupDetail(groupId, true), loadGroups()]);
          renderPool();
        } catch (e) {
          toast('移出失败：' + e.message, 'err');
        }
        return;
      }

      if (action === 'toggle-member') {
        const memberId = Number(target.getAttribute('data-member-id'));
        const nextEnabled = Number(target.getAttribute('data-member-enabled'));
        try {
          assertSuccess(await api.updateGroupMember(memberId, { enabled: nextEnabled }), '更新失败');
          await refreshOpenGroups();
        } catch (e) {
          toast('更新失败：' + e.message, 'err');
        }
        return;
      }

      if (action === 'remove-rel') {
        const ref = target.getAttribute('data-ref') || '';
        const parts = ref.split(':');
        const kind = parts[0];
        const relId = Number(parts[1]);
        const modelId = Number(target.getAttribute('data-model-id'));
        const name = target.getAttribute('data-rel-name') || '';
        if (!confirm('确认移除候选「' + name + '」？')) return;
        try {
          const res = kind === 'g' ? await api.removeGroupRel(relId) : await api.removeChannelRel(relId);
          assertSuccess(res, '移除失败');
          toast('已移除候选', 'ok');
          await ensureModelDetail(modelId, true);
        } catch (e) {
          toast('移除失败：' + e.message, 'err');
        }
        return;
      }

      if (action === 'group-delete') {
        const id = Number(target.getAttribute('data-group-id'));
        const name = target.getAttribute('data-group-name') || '';
        if (!confirm('确认删除小组「' + name + '」？被入口模型引用时后端会拒绝删除。')) return;
        try {
          assertSuccess(await api.deleteGroup(id), '删除失败');
          toast('小组已删除', 'ok');
          state.groupDetail.delete(id);
          state.groupExpanded.delete(id);
          await loadGroups();
          renderPool();
        } catch (e) {
          toast('删除失败：' + e.message, 'err');
        }
        return;
      }
    });

    // 下拉/复选/权重等改动统一走 change 事件
    topo.addEventListener('change', async event => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.getAttribute('data-action');

      if (action === 'group-strategy') {
        const id = Number(target.getAttribute('data-group-id'));
        try {
          assertSuccess(await api.updateGroup(id, { strategy: target.value }), '更新失败');
          toast('路由方式已更新', 'ok');
          await loadGroups();
        } catch (e) {
          toast('更新失败：' + e.message, 'err');
        }
        return;
      }

      if (action === 'group-sticky') {
        const id = Number(target.getAttribute('data-group-id'));
        try {
          assertSuccess(await api.updateGroup(id, { sticky: target.checked ? 1 : 0 }), '更新失败');
          await loadGroups();
          await refreshOpenGroups();
        } catch (e) {
          toast('更新失败：' + e.message, 'err');
        }
        return;
      }

      if (action === 'member-weight') {
        const memberId = Number(target.getAttribute('data-member-id'));
        const weight = Math.max(1, Math.min(1000, Number(target.value) || 1));
        target.value = weight;
        try {
          assertSuccess(await api.updateGroupMember(memberId, { weight: weight }), '更新失败');
          toast('权重已更新为 ' + weight, 'ok');
          await refreshOpenGroups();
        } catch (e) {
          toast('更新失败：' + e.message, 'err');
        }
        return;
      }
    });

    $('#pool-search').addEventListener('input', debounce(event => {
      state.filters.pool = event.target.value;
      renderPool();
    }, 200));

    $('#model-search').addEventListener('input', debounce(event => {
      state.filters.model = event.target.value;
      renderModels();
    }, 200));

    $('#group-strategy-filter').addEventListener('change', event => {
      state.filters.strategy = event.target.value;
      renderGroups();
    });

    $('#btn-new-group').addEventListener('click', () => {
      state.newGroupOpen = !state.newGroupOpen;
      renderGroups();
      const input = $('#new-group-name');
      if (input) input.focus();
    });

    $('#groups-body').addEventListener('keydown', event => {
      if (event.key === 'Enter' && event.target.id === 'new-group-name') {
        event.preventDefault();
        createGroup();
      }
    });
  }

  /** 已展开的小组统一刷新详情（策略/权重变更后保持一致视图）。 */
  async function refreshOpenGroups() {
    const ids = Array.from(state.groupExpanded);
    await Promise.all(ids.map(id => ensureGroupDetail(id, true)));
    renderGroups();
  }

  async function createGroup() {
    const nameInput = $('#new-group-name');
    const strategyInput = $('#new-group-strategy');
    const stickyInput = $('#new-group-sticky');
    if (!nameInput) return;

    const name = nameInput.value.trim();
    if (!name) {
      toast('请填写小组名称', 'err');
      nameInput.focus();
      return;
    }
    try {
      assertSuccess(await api.createGroup({
        name: name,
        strategy: strategyInput ? strategyInput.value : 'random',
        sticky: stickyInput && stickyInput.checked ? 1 : 0
      }), '创建失败');
      toast('小组已创建：' + name, 'ok');
      state.newGroupOpen = false;
      await loadGroups();
    } catch (e) {
      toast('创建失败：' + e.message, 'err');
    }
  }

  function bindLogEvents() {
    const view = $('#view-logs');

    view.addEventListener('click', async event => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.getAttribute('data-action');

      if (action === 'toggle-trace') {
        const card = target.closest('.trace-card');
        const traceId = card ? card.getAttribute('data-trace-id') : '';
        if (!traceId) return;
        if (state.logs.open.has(traceId)) state.logs.open.delete(traceId);
        else state.logs.open.add(traceId);
        renderLogs();
        return;
      }

      if (action === 'copy-trace') {
        const traceId = target.getAttribute('data-trace-id') || '';
        await copyText(traceId);
        return;
      }

      if (action === 'filter-by-trace') {
        const traceId = target.getAttribute('data-trace-id') || '';
        state.logs.traceFilter = traceId;
        $('#log-trace-search').value = traceId;
        renderLogs();
        return;
      }

      if (action === 'toggle-request-data') {
        const traceId = target.getAttribute('data-trace-id') || '';
        await toggleRequestData(traceId);
        return;
      }
    });

    $('#btn-log-query').addEventListener('click', () => {
      applyLogFilters();
      loadLogs(true);
    });

    $('#btn-log-reset').addEventListener('click', () => {
      $('#log-model').value = '';
      $('#log-start').value = '';
      $('#log-end').value = '';
      $('#log-trace-search').value = '';
      state.logs.traceFilter = '';
      state.logs.filters = { modelName: '', startTime: '', endTime: '' };
      loadLogs(true);
    });

    $('#log-trace-search').addEventListener('input', debounce(event => {
      state.logs.traceFilter = event.target.value;
      renderLogs();
    }, 200));

    $('#log-live').addEventListener('change', event => toggleLive(event.target.checked));

    $('#load-more').addEventListener('click', () => {
      if (!state.logs.loading && state.logs.hasMore) loadLogs(false);
    });

    // 滚动到底自动续页，避免大列表频繁点按
    window.addEventListener('scroll', debounce(() => {
      if (state.view !== 'logs') return;
      if (!state.logs.hasMore || state.logs.loading) return;
      const remain = document.documentElement.scrollHeight - window.scrollY - window.innerHeight;
      if (remain < 400) loadLogs(false);
    }, 200));
  }

  function applyLogFilters() {
    const toIso = value => (value ? new Date(value).toISOString() : '');
    state.logs.filters = {
      modelName: $('#log-model').value,
      startTime: toIso($('#log-start').value),
      endTime: toIso($('#log-end').value)
    };
  }

  async function copyText(text) {
    if (!text) return;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      toast('已复制：' + text, 'ok');
    } catch (e) {
      toast('复制失败，请手动选择文本', 'err');
    }
  }

  /* ══════════════════════════ 12. 视图切换 / 登录 / 启动 ══════════════════════════ */

  function switchView(name) {
    state.view = name;
    $all('.tab').forEach(tab => tab.classList.toggle('is-active', tab.getAttribute('data-view') === name));
    $('#view-topology').classList.toggle('is-active', name === 'topology');
    $('#view-logs').classList.toggle('is-active', name === 'logs');

    if (name === 'logs') {
      if (!state.logs.order.length) {
        loadLogModelOptions();
        loadLogs(true);
      }
    }
  }

  function openLogin(message) {
    $('#login-mask').classList.add('is-open');
    $('#login-error').textContent = message || '';
    const user = $('#login-user');
    if (user) user.focus();
  }

  function closeLogin() {
    $('#login-mask').classList.remove('is-open');
    $('#login-error').textContent = '';
    $('#login-pass').value = '';
  }

  function bindAuthEvents() {
    $('#login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const username = $('#login-user').value.trim();
      const password = $('#login-pass').value;
      const submit = $('#login-submit');
      if (!username || !password) {
        $('#login-error').textContent = '请填写用户名和密码';
        return;
      }
      submit.disabled = true;
      submit.textContent = '登录中…';
      try {
        await api.login(username, password);
        $('#whoami').textContent = username;
        closeLogin();
        await bootstrap();
      } catch (e) {
        $('#login-error').textContent = e.message;
      } finally {
        submit.disabled = false;
        submit.textContent = '登录';
      }
    });

    $('#btn-logout').addEventListener('click', async () => {
      await api.logout();
      $('#whoami').textContent = '';
      if (state.logs.liveSource) toggleLive(false);
      openLogin('已退出登录');
    });

    $('#btn-refresh').addEventListener('click', () => {
      if (state.view === 'logs') loadLogs(true);
      else loadAllTopology();
    });

    $('#btn-theme').addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('admin_theme', next); } catch (e) { /* 忽略 */ }
    });

    $all('.tab').forEach(tab => {
      tab.addEventListener('click', () => switchView(tab.getAttribute('data-view')));
    });
  }

  function initTheme() {
    let theme = 'light';
    try {
      theme = localStorage.getItem('admin_theme') ||
        (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) { /* 忽略 */ }
    document.documentElement.setAttribute('data-theme', theme);
  }

  async function loadAllTopology() {
    await Promise.all([loadPool(), loadGroups(), loadModels()]);
    // 默认展开第一个小组，让「拖拽配置」一进来就可操作。
    if (!state.groupExpanded.size && state.groups.length) {
      const first = state.groups[0];
      state.groupExpanded.add(first.id);
      await ensureGroupDetail(first.id);
      renderGroups();
    }
  }

  /** 鉴权探活：/auth/check 免拦截，可判断是否已登录。 */
  async function checkAuth() {
    try {
      const data = await api.request('GET', '/auth/check');
      return !!(data && data.authenticated);
    } catch (e) {
      return false;
    }
  }

  async function bootstrap() {
    try {
      await loadAllTopology();
    } catch (e) {
      toast('初始化失败：' + e.message, 'err');
    }
  }

  async function init() {
    initTheme();
    bindTopologyEvents();
    bindLogEvents();
    bindAuthEvents();

    api.onUnauthorized = () => {
      if (state.logs.liveSource) toggleLive(false);
      openLogin('登录已过期，请重新登录');
    };

    const authenticated = await checkAuth();
    if (!authenticated) {
      api.setToken('');
      openLogin('请登录后使用');
      return;
    }
    $('#whoami').textContent = '已登录';
    await bootstrap();
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
