<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My AI Gateway · 新版控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2361afef'/%3E%3C/svg%3E" />
<style>
/* ══════════════════════════════════════════════════════════════
   设计令牌：与现有 Vue 后台（assets/styles/index.css）同一套
   oklch 色彩体系，保证两个入口视觉一致。
   ══════════════════════════════════════════════════════════════ */
:root {
  --radius-sm: 6px;
  --radius: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;

  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;

  --accent-blue: #61afef;
  --accent-green: #98c379;
  --accent-red: #e06c75;
  --accent-yellow: #e5c07b;
  --accent-purple: #c678dd;
  --accent-cyan: #56b6c2;
}

:root,
[data-theme="light"] {
  --bg-primary: oklch(0.985 0 0);
  --bg-secondary: oklch(1 0 0);
  --bg-tertiary: oklch(0.96 0 0);
  --bg-hover: oklch(0.93 0 0);
  --border-color: oklch(0.90 0 0);
  --border-strong: oklch(0.84 0 0);
  --text-primary: oklch(0.15 0 0);
  --text-secondary: oklch(0.48 0 0);
  --text-muted: oklch(0.62 0 0);
  --primary: oklch(0.20 0 0);
  --primary-fg: oklch(0.98 0 0);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 1px 1px rgba(0,0,0,0.02);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
  --drop-bg: rgba(97, 175, 239, 0.10);
  --drop-border: #61afef;
}

[data-theme="dark"] {
  --bg-primary: #000000;
  --bg-secondary: #0a0a0a;
  --bg-tertiary: #141414;
  --bg-hover: #1e1e1e;
  --border-color: #282828;
  --border-strong: #3a3a3a;
  --text-primary: #f5f5f5;
  --text-secondary: #a3a3a3;
  --text-muted: #6b6b6b;
  --primary: #f5f5f5;
  --primary-fg: #000000;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.45);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.6);
  --drop-bg: rgba(97, 175, 239, 0.14);
  --drop-border: #61afef;
}

*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-primary);
  background: var(--bg-primary);
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

/* ── 滚动条 ── */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
::-webkit-scrollbar-track { background: transparent; }

/* ── 顶栏 ── */
.topbar {
  height: 56px;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 20px;
  border-bottom: 1px solid var(--border-color);
  background: var(--bg-secondary);
  position: sticky;
  top: 0;
  z-index: 30;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: -0.01em; }
.brand-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
  box-shadow: 0 0 8px rgba(97,175,239,0.5);
}
.brand small { font-weight: 400; color: var(--text-muted); font-size: 12px; }

.tabs { display: flex; gap: 4px; margin-left: 8px; }
.tab {
  border: 0; background: transparent; cursor: pointer;
  padding: 6px 12px; border-radius: var(--radius-sm);
  color: var(--text-secondary); font-weight: 500;
  transition: background .15s, color .15s;
}
.tab:hover { background: var(--bg-hover); color: var(--text-primary); }
.tab.is-active { background: var(--bg-tertiary); color: var(--text-primary); }

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

/* ── 通用控件 ── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border-color);
  background: var(--bg-secondary);
  color: var(--text-primary);
  padding: 6px 12px; border-radius: var(--radius-sm);
  cursor: pointer; font-weight: 500; white-space: nowrap;
  transition: background .15s, border-color .15s, opacity .15s;
}
.btn:hover:not(:disabled) { background: var(--bg-hover); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.btn-primary:hover:not(:disabled) { opacity: .88; background: var(--primary); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover:not(:disabled) { background: var(--bg-hover); }
.btn-sm { padding: 3px 8px; font-size: 12px; }
.btn-icon { padding: 4px 6px; line-height: 1; }

.input, .select {
  border: 1px solid var(--border-color);
  background: var(--bg-secondary);
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  outline: none;
  min-width: 0;
  transition: border-color .15s, box-shadow .15s;
}
.input:focus, .select:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(97,175,239,0.15); }
.input-sm, .select-sm { padding: 3px 8px; font-size: 12px; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 7px; border-radius: 999px;
  font-size: 11px; font-weight: 600; line-height: 1.6;
  background: var(--bg-tertiary); color: var(--text-secondary);
  border: 1px solid var(--border-color);
  white-space: nowrap;
}
.badge-blue   { color: #2b6cb0; background: rgba(97,175,239,.14); border-color: rgba(97,175,239,.35); }
.badge-green  { color: #2f7a3e; background: rgba(152,195,121,.16); border-color: rgba(152,195,121,.4); }
.badge-red    { color: #b3394a; background: rgba(224,108,117,.16); border-color: rgba(224,108,117,.4); }
.badge-yellow { color: #93701f; background: rgba(229,192,123,.18); border-color: rgba(229,192,123,.45); }
.badge-purple { color: #8b4a9e; background: rgba(198,120,221,.16); border-color: rgba(198,120,221,.4); }
.badge-muted  { color: var(--text-muted); }
[data-theme="dark"] .badge-blue   { color: #8cc4f0; }
[data-theme="dark"] .badge-green  { color: #a9d68f; }
[data-theme="dark"] .badge-red    { color: #f08b93; }
[data-theme="dark"] .badge-yellow { color: #e8cd8f; }
[data-theme="dark"] .badge-purple { color: #d9a2e6; }

.mono { font-family: var(--font-mono); font-size: 12px; }
.muted { color: var(--text-muted); }
.secondary { color: var(--text-secondary); }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nowrap { white-space: nowrap; }

.spinner {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--border-strong); border-top-color: var(--accent-blue);
  animation: spin .7s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty-state {
  padding: 28px 16px; text-align: center;
  color: var(--text-muted); font-size: 13px;
}

/* ══════════════════════════════════════════════════════════════
   配置拓扑：三列（渠道模型池 → 小组 → 入口模型）
   ══════════════════════════════════════════════════════════════ */
.view { display: none; }
.view.is-active { display: block; }

#view-topology {
  display: none;
  padding: 16px 20px 40px;
}
#view-topology.is-active { display: block; }

.board {
  display: grid;
  grid-template-columns: minmax(260px, 1fr) minmax(300px, 1.15fr) minmax(300px, 1.15fr);
  gap: 14px;
  align-items: start;
}
@media (max-width: 1180px) {
  .board { grid-template-columns: 1fr; }
}

.col {
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  background: var(--bg-secondary);
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 100px);
  min-height: 240px;
  overflow: hidden;
}
.col-head {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-tertiary);
}
.col-head .col-title { font-weight: 600; font-size: 13px; }
.col-head .col-step {
  width: 18px; height: 18px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  background: var(--primary); color: var(--primary-fg);
  flex: none;
}
.col-head .col-hint { color: var(--text-muted); font-size: 11px; }
.col-tools {
  display: flex; gap: 6px; padding: 8px 10px;
  border-bottom: 1px solid var(--border-color);
  background: var(--bg-secondary);
  flex-wrap: wrap;
}
.col-tools .input, .col-tools .select { flex: 1 1 90px; }
.col-body { overflow: auto; padding: 8px; flex: 1; }

/* ── 渠道分组（池） ── */
.ch-group { border: 1px solid var(--border-color); border-radius: var(--radius); margin-bottom: 6px; overflow: hidden; }
.ch-group.is-expanded { border-color: var(--border-strong); }
.ch-head {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 9px; cursor: pointer; user-select: none;
  background: var(--bg-tertiary);
}
.ch-head:hover { background: var(--bg-hover); }
.ch-head .caret { color: var(--text-muted); font-size: 10px; width: 10px; flex: none; }
.ch-head .ch-name { font-weight: 500; font-size: 13px; }
.ch-head .ch-meta { margin-left: auto; }

.pool-item {
  display: flex; align-items: flex-start; gap: 6px;
  padding: 6px 8px; margin: 4px 0;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  background: var(--bg-secondary);
  cursor: grab;
  transition: border-color .12s, background .12s;
}
.pool-item:hover { border-color: var(--border-strong); background: var(--bg-tertiary); }
.pool-item:active { cursor: grabbing; }
.pool-item.is-dragging { opacity: .45; }
.pool-item-main { min-width: 0; flex: 1; }
.pool-item-name { font-size: 12.5px; font-weight: 500; }
.pool-item-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 6px; flex-wrap: wrap; }
.pool-item.is-in-group { opacity: .62; }
.pool-item.is-in-group::after {
  content: '已在组内'; font-size: 10px; color: var(--accent-green);
  align-self: center; white-space: nowrap;
}

/* ── 小组 / 入口模型卡片 ── */
.card {
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  background: var(--bg-secondary);
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color .12s, box-shadow .12s;
}
.card.is-drop-target {
  border-color: var(--drop-border);
  box-shadow: 0 0 0 3px var(--drop-bg);
  background: var(--drop-bg);
}
.card-head {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; cursor: pointer; user-select: none;
}
.card-head:hover { background: var(--bg-tertiary); }
.card-title { font-weight: 600; font-size: 13px; min-width: 0; }
.card-sub { font-size: 11px; color: var(--text-muted); }
.card-spacer { margin-left: auto; }
.card-actions { display: flex; gap: 4px; align-items: center; }
.card-body { border-top: 1px solid var(--border-color); padding: 8px; }

.card[draggable="true"] .card-head { cursor: grab; }
.card[draggable="true"].is-dragging { opacity: .45; }

/* 候选/成员行 */
.row-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  background: var(--bg-secondary);
  margin-bottom: 5px;
}
.row-item:hover { background: var(--bg-tertiary); }
.row-item.is-dirty { border-color: var(--accent-yellow); }
.row-item[draggable="true"] { cursor: grab; }
.row-item.is-dragging { opacity: .4; }
.row-index {
  width: 20px; flex: none; text-align: center;
  font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
}
.row-main { min-width: 0; flex: 1; }
.row-name { font-size: 12.5px; font-weight: 500; }
.row-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.row-tools { display: flex; gap: 4px; align-items: center; flex: none; }
.weight-input { width: 52px; text-align: center; }

.drop-empty {
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 10px; text-align: center;
  color: var(--text-muted); font-size: 12px;
}

.drop-zone-hint {
  margin: 4px 0 0;
  border: 1px dashed var(--border-color);
  border-radius: var(--radius-sm);
  padding: 6px;
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
}
.card.is-drop-target .drop-zone-hint { border-color: var(--drop-border); color: var(--accent-blue); }

/* ══════════════════════════════════════════════════════════════
   日志链路追踪
   ══════════════════════════════════════════════════════════════ */
#view-logs { display: none; padding: 16px 20px 40px; }
#view-logs.is-active { display: block; }

.log-toolbar {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  padding: 10px 12px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  background: var(--bg-secondary);
  box-shadow: var(--shadow-sm);
  margin-bottom: 12px;
}
.log-toolbar .input, .log-toolbar .select { min-width: 120px; }
.log-toolbar label { font-size: 12px; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 5px; }

.trace-list { display: flex; flex-direction: column; gap: 8px; }

.trace-card {
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  background: var(--bg-secondary);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.trace-card.is-open { border-color: var(--border-strong); }

.trace-head {
  display: grid;
  grid-template-columns: 190px 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 9px 12px;
  cursor: pointer;
  user-select: none;
}
.trace-head:hover { background: var(--bg-tertiary); }
.trace-id-wrap { display: flex; align-items: center; gap: 6px; min-width: 0; }
.trace-id {
  font-family: var(--font-mono); font-size: 12px;
  color: var(--text-primary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.trace-copy {
  border: 0; background: transparent; cursor: pointer;
  color: var(--text-muted); padding: 0 2px; font-size: 11px;
  border-radius: 4px; flex: none;
}
.trace-copy:hover { color: var(--accent-blue); background: var(--bg-hover); }
.trace-summary { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.trace-meta { display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 11.5px; white-space: nowrap; }

.trace-timeline { border-top: 1px solid var(--border-color); padding: 10px 12px 12px; background: var(--bg-primary); }

.waterfall {
  display: flex; align-items: stretch; gap: 0;
  height: 22px; margin: 4px 0 10px;
  border-radius: var(--radius-sm);
  background: var(--bg-tertiary);
  overflow: hidden;
  position: relative;
}
.wf-seg {
  height: 100%;
  border-right: 1px solid var(--bg-primary);
  position: relative;
  min-width: 2px;
  cursor: default;
}
.wf-seg:last-child { border-right: 0; }
.wf-seg--start { background: rgba(97,175,239,.55); }
.wf-seg--retry { background: rgba(229,192,123,.7); }
.wf-seg--reroute { background: rgba(198,120,221,.6); }
.wf-seg--success { background: rgba(152,195,121,.8); }
.wf-seg--fail { background: rgba(224,108,117,.8); }
.wf-seg--skip { background: rgba(160,160,160,.45); }
.wf-seg--interrupted { background: rgba(120,120,120,.6); }
.wf-axis { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--text-muted); margin-bottom: 8px; }

.hop {
  display: grid;
  grid-template-columns: 26px 96px minmax(160px, 1.3fr) minmax(120px, 1fr) auto;
  gap: 10px; align-items: center;
  padding: 7px 8px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  background: var(--bg-secondary);
  margin-bottom: 5px;
}
.hop:hover { background: var(--bg-tertiary); }
.hop-no { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); text-align: center; }
.hop-route { min-width: 0; }
.hop-route-name { font-size: 12.5px; font-weight: 500; }
.hop-route-sub { font-size: 11px; color: var(--text-muted); }
.hop-bar { height: 12px; border-radius: 3px; background: var(--bg-tertiary); position: relative; overflow: hidden; }
.hop-bar-fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; min-width: 2px; }
.hop-bar-fill--start { background: rgba(97,175,239,.75); }
.hop-bar-fill--retry { background: rgba(229,192,123,.85); }
.hop-bar-fill--reroute { background: rgba(198,120,221,.8); }
.hop-bar-fill--success { background: rgba(152,195,121,.9); }
.hop-bar-fill--fail { background: rgba(224,108,117,.9); }
.hop-bar-fill--skip { background: rgba(160,160,160,.55); }
.hop-bar-fill--interrupted { background: rgba(120,120,120,.7); }
.hop-metrics { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.hop-metric { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); white-space: nowrap; }
.hop-message {
  grid-column: 1 / -1;
  font-size: 11.5px; color: var(--text-secondary);
  background: var(--bg-tertiary);
  border-radius: var(--radius-sm);
  padding: 5px 8px;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 160px;
  overflow: auto;
}
.hop-message.is-error { color: #b3394a; }
[data-theme="dark"] .hop-message.is-error { color: #f08b93; }

.trace-foot { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }

.request-data {
  margin-top: 8px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  background: var(--bg-secondary);
  padding: 8px;
}
.request-data pre {
  margin: 6px 0 0;
  font-family: var(--font-mono); font-size: 11px;
  max-height: 320px; overflow: auto;
  white-space: pre-wrap; word-break: break-word;
}

.load-more {
  text-align: center; padding: 14px; color: var(--text-muted); font-size: 12px;
}

/* ── 登录遮罩 ── */
.login-mask {
  position: fixed; inset: 0; z-index: 100;
  display: none; align-items: center; justify-content: center;
  background: var(--bg-primary);
  padding: 20px;
}
.login-mask.is-open { display: flex; }
.login-box {
  width: 100%; max-width: 360px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  background: var(--bg-secondary);
  box-shadow: var(--shadow-lg);
  padding: 24px;
}
.login-box h1 { margin: 0 0 4px; font-size: 18px; }
.login-box p.sub { margin: 0 0 18px; color: var(--text-muted); font-size: 12.5px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.field .input { width: 100%; }
.login-error { color: var(--accent-red); font-size: 12px; min-height: 18px; margin-bottom: 8px; }
.login-box .btn { width: 100%; justify-content: center; }

/* ── Toast ── */
.toast-host {
  position: fixed; right: 18px; bottom: 18px; z-index: 200;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
.toast {
  min-width: 200px; max-width: 380px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  background: var(--bg-secondary);
  box-shadow: var(--shadow-md);
  font-size: 12.5px;
  animation: toast-in .18s ease-out;
}
.toast--ok { border-left: 3px solid var(--accent-green); }
.toast--err { border-left: 3px solid var(--accent-red); }
.toast--info { border-left: 3px solid var(--accent-blue); }
@keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ── 工具类 ── */
.hidden { display: none !important; }
.flex { display: flex; }
.gap-6 { gap: 6px; }
.items-center { align-items: center; }
</style>
</head>
<body>

<!-- ══════════════ 顶栏 ══════════════ -->

  <div class="brand">

<div class="toast-host" id="toast-host"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   新版控制台（单文件，零构建依赖）
   ──────────────────────────────────────────────────────────────────────────
   仅消费现有后端 REST 契约，不引入新的接口：
     · GET  /admin/api/channels、/channels/:id/models      渠道模型池
     · GET  /admin/api/model-groups、/model-groups/:id     小组及成员
     · GET  /admin/api/models、/models/:id/rels             入口模型及候选队列
     · POST /model-groups/:id/members、/models/:id/rels     建立两级关联
     · PUT  /model-groups/members/sort、/models/rels/sort   拖拽排序
     · GET  /admin/api/logs、/logs/stream                   日志与链路追踪
   模块划分：utils → api → state → topology（三段式拖拽）→ logs（链路追踪）→ app
   ══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  /* ══════════════════════════ 1. utils ══════════════════════════ */

  const $ = (sel, root) => (root || document).querySelector(sel);
  const $all = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  /** HTML 文本转义：所有动态内容拼进模板前必须经过它。 */
  function esc(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function toast(message, kind) {
    const host = $('#toast-host');
    if (!host) return;
    const node = document.createElement('div');
    node.className = 'toast toast--' + (kind || 'info');
    node.textContent = message;
    host.appendChild(node);
    setTimeout(() => node.remove(), 3200);
  }

  /** 轻量防抖：用于搜索框与 SSE 高频推送后的重绘。 */
  function debounce(fn, wait) {
    let timer = null;
    return function () {
      const args = arguments;
      clearTimeout(timer);
      timer = setTimeout(() => fn.apply(null, args), wait || 200);
    };
  }

  /* ══════════════════════════ 2. 展示格式化 ══════════════════════════ */

  /** 阶段文案：与现有后台 locales 的 log.phase.* 保持一致。 */
  const PHASE_LABEL = {
    start: '请求开始',
    retry: '重试',
    reroute: '重路由',
    success: '成功',
    fail: '失败',
    skip: '跳过',
    interrupted: '中断'
  };

  /** 阶段 → 徽章配色（终态决定整行观感）。 */
  const PHASE_BADGE = {
    start: 'badge-blue',
    retry: 'badge-yellow',
    reroute: 'badge-purple',
    success: 'badge-green',
    fail: 'badge-red',
    skip: 'badge-muted',
    interrupted: 'badge-muted'
  };

  const PROTOCOL_LABEL = {
    'openai-chat': 'OpenAI Chat',
    'anthropic-messages': 'Anthropic Messages',
    'openai-responses': 'OpenAI Responses',
    embeddings: 'Embeddings'
  };

  function phaseLabel(phase) {
    return PHASE_LABEL[phase] || phase || '-';
  }

  function phaseBadge(phase) {
    return 'badge ' + (PHASE_BADGE[phase] || 'badge-muted');
  }

  function protocolLabel(protocol) {
    return PROTOCOL_LABEL[protocol] || protocol;
  }

  function routeSourceLabel(source) {
    if (source === 'sticky') return '粘性';
    if (source === 'sticky_fallback') return '粘性回退';
    return '';
  }

  function routeSourceTitle(source) {
    if (source === 'sticky') return '本次请求由会话粘性哈希命中的小组成员承接';
    if (source === 'sticky_fallback') return '粘性命中的成员失败，已回退到组内其他成员';
    return '';
  }

  const STRATEGY_LABEL = {
    failover: '故障转移',
    random: '随机加权',
    round_robin: '轮询'
  };

  function strategyLabel(strategy) {
    return STRATEGY_LABEL[strategy] || strategy || '-';
  }

  /** 毫秒 → 人类可读耗时（<1s 用毫秒，其余保留 2 位秒）。 */
  function fmtDuration(ms) {
    if (ms === null || ms === undefined || ms === '' || isNaN(ms)) return '-';
    const n = Number(ms);
    if (n <= 0) return '0ms';
    if (n < 1000) return Math.round(n) + 'ms';
    if (n < 60000) return (n / 1000).toFixed(2) + 's';
    return Math.floor(n / 60000) + 'm' + Math.round((n % 60000) / 1000) + 's';
  }

  function pad2(n) {
    return n < 10 ? '0' + n : String(n);
  }

  /** ISO 时间串 → 本地 HH:mm:ss.SSS（链路时间线用）。 */
  function fmtClock(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()) +
      '.' + String(d.getMilliseconds()).padStart(3, '0');
  }

  /** ISO 时间串 → 本地 MM-DD HH:mm:ss（列表摘要用）。 */
  function fmtDateTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' +
      pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  }

  function fmtInt(n) {
    if (n === null || n === undefined || n === '') return '-';
    const v = Number(n);
    if (isNaN(v)) return '-';
    return v.toLocaleString('zh-CN');
  }

  /** 上下文窗口：按 1M / 128k 缩写，避免长表格被数字撑开。 */
  function fmtContext(tokens) {
    if (!tokens || tokens <= 0) return '-';
    if (tokens >= 1000000) return (tokens / 1000000).toFixed(tokens % 1000000 === 0 ? 0 : 1) + 'M';
    if (tokens >= 1000) return Math.round(tokens / 1000) + 'k';
    return String(tokens);
  }

  /* ══════════════════════════ 3. api ══════════════════════════ */

  const TOKEN_KEY = 'admin_token';
  const API_BASE = '/admin/api';

  /**
   * 极简 API 客户端：与现有 Vue 后台共用 localStorage 里的 admin_token，
   * 因此在同一域名下两个入口的登录态天然互通。
   */
  const api = {
    token: localStorage.getItem(TOKEN_KEY) || '',

    setToken(token) {
      this.token = token || '';
      if (token) localStorage.setItem(TOKEN_KEY, token);
      else localStorage.removeItem(TOKEN_KEY);
    },

    async request(method, path, body) {
      const headers = { 'Content-Type': 'application/json' };
      if (this.token) headers.Authorization = 'Bearer ' + this.token;

      const res = await fetch(API_BASE + path, {
        method: method,
        headers: headers,
        credentials: 'same-origin',
        body: body === undefined ? undefined : JSON.stringify(body)
      });

      if (res.status === 401) {
        api.setToken('');
        // 统一拉起登录框：任何接口的 401 都收敛到一处处理。
        if (typeof api.onUnauthorized === 'function') api.onUnauthorized();
        throw Object.assign(new Error('未登录或登录已过期'), { status: 401 });
      }
      const text = await res.text();
      let data = null;
      if (text) {
        try { data = JSON.parse(text); } catch (e) { data = null; }
      }
      if (!res.ok) {
        const msg = (data && (data.error || data.message)) || ('请求失败 (' + res.status + ')');
        throw Object.assign(new Error(msg), { status: res.status, data: data });
      }
      return data;
    },

    async login(username, password) {
      const data = await this.request('POST', '/auth/login', { username: username, password: password });
      if (!data || !data.success) throw new Error((data && data.error) || '登录失败');
      this.setToken(data.token);
      return data;
    },

    async logout() {
      try { await this.request('POST', '/auth/logout', {}); } catch (e) { /* 忽略：本地清理即可 */ }
      this.setToken('');
    },

    /* ── 渠道 / 渠道模型 ── */
    channels() { return this.request('GET', '/channels'); },
    channelModels(channelId) { return this.request('GET', '/channels/' + channelId + '/models'); },

    /* ── 小组 ── */
    groups() { return this.request('GET', '/model-groups'); },
    group(id) { return this.request('GET', '/model-groups/' + id); },
    createGroup(payload) { return this.request('POST', '/model-groups', payload); },
    updateGroup(id, payload) { return this.request('PUT', '/model-groups/' + id, payload); },
    deleteGroup(id) { return this.request('DELETE', '/model-groups/' + id); },
    addGroupMembers(groupId, channelModelIds) {
      return this.request('POST', '/model-groups/' + groupId + '/members', { channelModelIds: channelModelIds });
    },
    removeGroupMember(memberId) { return this.request('DELETE', '/model-groups/members/' + memberId); },
    sortGroupMembers(memberIds) {
      return this.request('PUT', '/model-groups/members/sort', { sortedMemberIds: memberIds });
    },
    updateGroupMember(memberId, payload) {
      return this.request('PUT', '/model-groups/members/' + memberId, payload);
    },

    /* ── 入口模型 ── */
    models() { return this.request('GET', '/models'); },
    modelRels(modelId) { return this.request('GET', '/models/' + modelId + '/rels'); },
    addModelRels(modelId, payload) { return this.request('POST', '/models/' + modelId + '/rels', payload); },
    removeChannelRel(relId) { return this.request('DELETE', '/models/rels/' + relId); },
    removeGroupRel(relId) { return this.request('DELETE', '/models/group-rels/' + relId); },
    sortRels(refs) { return this.request('PUT', '/models/rels/sort', { sortedRelIds: refs }); },

    /* ── 日志 ── */
    logs(params) {
      const qs = new URLSearchParams();
      Object.keys(params || {}).forEach(key => {
        const v = params[key];
        if (v !== undefined && v !== null && v !== '') qs.set(key, v);
      });
      return this.request('GET', '/logs?' + qs.toString());
    },
    requestData(logId) { return this.request('GET', '/logs/' + logId + '/request-data'); }
  };

  /** 业务接口统一带 {success:false,error} 失败信封，这里集中抛出。 */
  function assertSuccess(data, fallback) {
    if (data && data.success === false) throw new Error(data.error || fallback || '操作失败');
    return data;
  }

  /* ══════════════════════════ 4. state ══════════════════════════ */

  const state = {
    view: 'topology',

    /* 拓扑视图 */
    channels: [],
    poolLoading: true,
    pool: [],                       // 扁平化的渠道模型
    poolByKey: new Map(),           // `${channelId}:${modelId}` → 池条目
    poolExpanded: new Set(),        // 展开的渠道 id
    groups: [],
    groupDetail: new Map(),         // groupId → { group, members, usedByModels }
    groupExpanded: new Set(),
    groupBusy: new Set(),           // 正在请求详情的小组
    models: [],
    modelDetail: new Map(),         // modelId → { model, rels, groupRels }
    modelExpanded: new Set(),
    modelBusy: new Set(),
    filters: { pool: '', model: '', strategy: '' },
    newGroupOpen: false,

    /* 日志视图 */
    logModels: [],
    logs: {
      loading: false,
      rows: new Map(),              // traceId → Map(logId → row)
      order: [],                    // traceId 展示顺序（最近结束优先）
      total: 0,
      offset: 0,
      limit: 20,
      hasMore: false,
      open: new Set(),              // 展开的 traceId
      traceFilter: '',
      filters: { modelName: '', startTime: '', endTime: '' },
      liveSource: null,
      requestData: new Map()        // logId → { headers, body }
    }
  };

  /* ══════════════════════════ 5. topology 数据加载 ══════════════════════════ */

  /** 加载渠道 + 各渠道模型，扁平化成「渠道模型池」。 */
  async function loadPool() {
    state.poolLoading = true;
    renderPool();
    try {
      const channels = await api.channels();
      state.channels = Array.isArray(channels) ? channels : [];

      // 并发上限 6：渠道数量级在几十，避免把后端打满。
      const items = [];
      const queue = state.channels.slice();
      const worker = async () => {
        while (queue.length) {
          const ch = queue.shift();
          try {
            const data = await api.channelModels(ch.id);
            (data && data.models ? data.models : []).forEach(m => {
              items.push({
                key: ch.id + ':' + m.id,
                id: m.id,
                modelName: m.modelName,
                displayName: m.displayName || m.modelName,
                channelId: ch.id,
                channelName: ch.name,
                channelType: ch.channelType,
                channelEnabled: ch.enabled,
                input: m.input,
                contextLength: m.contextLength,
                linked: m.linked
              });
            });
          } catch (e) {
            // 单个渠道失败不阻断整体：保留其余渠道可用。
            console.warn('加载渠道模型失败', ch.name, e);
          }
        }
      };
      await Promise.all([worker(), worker(), worker(), worker(), worker(), worker()]);
      items.sort((a, b) => (a.channelName + a.modelName).localeCompare(b.channelName + b.modelName));
      state.pool = items;
      state.poolByKey = new Map(items.map(item => [item.key, item]));
      // 首屏默认展开第一个渠道：池里上千条模型全部展开会让 DOM 膨胀，
      // 但全折叠又让人无从下手，因此只开一个作为拖拽起点。
      if (!state.poolExpanded.size && items.length) {
        state.poolExpanded.add(items[0].channelId);
      }
    } catch (e) {
      toast('加载渠道模型失败：' + e.message, 'err');
    } finally {
      state.poolLoading = false;
      renderPool();
      renderGroups();
      renderModels();
    }
  }

  async function loadGroups() {
    try {
      const data = await api.groups();
      state.groups = Array.isArray(data) ? data : [];
    } catch (e) {
      toast('加载小组失败：' + e.message, 'err');
    }
    renderGroups();
  }

  async function loadModels() {
    try {
      const data = await api.models();
      state.models = Array.isArray(data) ? data : [];
    } catch (e) {
      toast('加载入口模型失败：' + e.message, 'err');
    }
    renderModels();
  }

  /** 小组详情按需加载：接口会附带全部可添加渠道模型（体积大），只读一次并缓存。 */
  async function ensureGroupDetail(groupId, force) {
    if (!force && state.groupDetail.has(groupId)) return state.groupDetail.get(groupId);
    if (state.groupBusy.has(groupId)) return null;
    state.groupBusy.add(groupId);
    renderGroups();
    try {
      const data = await api.group(groupId);
      state.groupDetail.set(groupId, data);
      return data;
    } catch (e) {
      toast('加载小组详情失败：' + e.message, 'err');
      return null;
    } finally {
      state.groupBusy.delete(groupId);
      renderGroups();
    }
  }

  /** 入口模型关联按需加载：同样避免首屏拉取超大 availableModels。 */
  async function ensureModelDetail(modelId, force) {
    if (!force && state.modelDetail.has(modelId)) return state.modelDetail.get(modelId);
    if (state.modelBusy.has(modelId)) return null;
    state.modelBusy.add(modelId);
    renderModels();
    try {
      const data = await api.modelRels(modelId);
      state.modelDetail.set(modelId, data);
      return data;
    } catch (e) {
      toast('加载模型关联失败：' + e.message, 'err');
      return null;
    } finally {
      state.modelBusy.delete(modelId);
      renderModels();
    }
  }

  /* ══════════════════════════ 6. topology 渲染 ══════════════════════════ */

  /** 某个渠道模型被哪些已加载小组占用（用于池里标注「已在组内」）。 */
  function memberGroupNames(channelModelId) {
    const names = [];
    state.groupDetail.forEach(detail => {
      if (!detail || !detail.members) return;
      const hit = detail.members.some(m => m.channelModelId === channelModelId);
      if (hit) names.push(detail.group ? detail.group.name : '');
    });
    return names.filter(Boolean);
  }

  function renderPool() {
    const host = $('#pool-body');
    if (!host) return;
    if (state.poolLoading) {
      host.innerHTML = '<div class="empty-state"><span class="spinner"></span> 正在加载渠道模型…</div>';
      return;
    }
    const keyword = state.filters.pool.trim().toLowerCase();
    const matched = keyword
      ? state.pool.filter(item =>
          (item.modelName || '').toLowerCase().includes(keyword) ||
          (item.channelName || '').toLowerCase().includes(keyword))
      : state.pool;

    if (!matched.length) {
      host.innerHTML = '<div class="empty-state">没有匹配的渠道模型</div>';
      return;
    }

    // 按渠道分组；搜索时只渲染命中项，且自动展开命中渠道。
    const byChannel = new Map();
    matched.forEach(item => {
      if (!byChannel.has(item.channelId)) {
        byChannel.set(item.channelId, { id: item.channelId, name: item.channelName, type: item.channelType, items: [] });
      }
      byChannel.get(item.channelId).items.push(item);
    });

    const html = [];
    byChannel.forEach(group => {
      // 搜索态下强制展开，且限制单渠道渲染条数，避免一次插入上万节点。
      const expanded = keyword ? true : state.poolExpanded.has(group.id);
      const limit = keyword ? 120 : 400;
      const visible = group.items.slice(0, limit);
      const hiddenCount = group.items.length - visible.length;

      html.push(
        '<div class="ch-group' + (expanded ? ' is-expanded' : '') + '">' +
          '<div class="ch-head" data-action="toggle-channel" data-channel-id="' + group.id + '">' +
            '<span class="caret">' + (expanded ? '▾' : '▸') + '</span>' +
            '<span class="ch-name ellipsis">' + esc(group.name) + '</span>' +
            '<span class="ch-meta badge badge-muted">' + group.items.length + '</span>' +
          '</div>' +
          (expanded
            ? '<div style="padding:4px 6px 6px">' + visible.map(item => {
                const inGroups = memberGroupNames(item.id);
                return '<div class="pool-item' + (inGroups.length ? ' is-in-group' : '') + '"' +
                  ' draggable="true" data-drag="pool" data-channel-model-id="' + item.id + '"' +
                  ' data-key="' + esc(item.key) + '"' +
                  ' title="拖到中间的小组即可加入成员">' +
                  '<div class="pool-item-main">' +
                    '<div class="pool-item-name ellipsis">' + esc(item.displayName) + '</div>' +
                    '<div class="pool-item-meta">' +
                      '<span>' + esc(group.name) + '</span>' +
                      '<span>ctx ' + fmtContext(item.contextLength) + '</span>' +
                      (item.input ? '<span>' + esc(item.input) + '</span>' : '') +
                      (inGroups.length ? '<span>组：' + esc(inGroups.join('、')) + '</span>' : '') +
                    '</div>' +
                  '</div>' +
                '</div>';
              }).join('') +
              (hiddenCount > 0
                ? '<div class="drop-zone-hint">另有 ' + hiddenCount + ' 个模型未展示，请用搜索缩小范围</div>'
                : '') +
              '</div>'
            : '') +
        '</div>'
      );
    });
    host.innerHTML = html.join('');
  }

  function renderGroups() {
    const host = $('#groups-body');
    if (!host) return;

    const filter = state.filters.strategy;
    const groups = state.groups.filter(g => !filter || g.strategy === filter);

    const parts = [];

    if (state.newGroupOpen) {
      parts.push(
        '<div class="card"><div class="card-body">' +
          '<div class="field"><label>小组名称</label>' +
            '<input class="input input-sm" id="new-group-name" placeholder="例如 deepseek-flash" style="width:100%" /></div>' +
          '<div class="field"><label>组内路由方式</label>' +
            '<select class="select select-sm" id="new-group-strategy" style="width:100%">' +
              '<option value="random">随机加权 random</option>' +
              '<option value="failover">故障转移 failover</option>' +
              '<option value="round_robin">轮询 round_robin</option>' +
            '</select></div>' +
          '<div class="flex gap-6 items-center" style="margin-top:8px">' +
            '<label class="secondary" style="font-size:12px">' +
              '<input type="checkbox" id="new-group-sticky" checked /> 会话粘性</label>' +
            '<span class="card-spacer"></span>' +
